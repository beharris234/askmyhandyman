# Free autopilot scheduler. Runs the text pipeline daily on GitHub's free
# runners (2,000 min/month free) and commits new draft cards to the queue so
# you can review them from your phone. Nothing is posted automatically.
name: content-factory

on:
  schedule:
    - cron: "0 13 * * *"   # daily 13:00 UTC — adjust to your timezone
  workflow_dispatch:        # lets you run it manually from the Actions tab
    inputs:
      niche:
        description: "Niche config path"
        default: "content-factory/config/niche.example.yaml"
      count:
        description: "Angles to generate"
        default: "1"

permissions:
  contents: write           # to commit the updated queue

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r content-factory/requirements.txt
      - name: Generate drafts
        env:
          # Add these as repo secrets (Settings → Secrets → Actions).
          # With neither set, the free built-in template engine is used.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: content-factory
        run: |
          python3 run.py \
            --niche "../${{ inputs.niche || 'content-factory/config/niche.example.yaml' }}" \
            --count "${{ inputs.count || 1 }}"
      - name: Commit new drafts
        run: |
          git config user.name "content-factory"
          git config user.email "bot@users.noreply.github.com"
          git add content-factory/output/queue.json || true
          git commit -m "chore: new content drafts $(date -u +%F)" || echo "no changes"
          git push || true
