<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0a0d0a">
<title>FieldGeneral — Team Chat</title>
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0a0d0a;color:#e7ece4;font-family:'Inter',sans-serif;display:flex;flex-direction:column}
.top{position:sticky;top:0;background:rgba(10,13,10,.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.06);padding:14px 16px;display:flex;align-items:center;gap:12px}
.top a{color:#8a9581;text-decoration:none;font-size:22px}
.top .t{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:1px}
.top .t .s{font-size:11px;color:#8a9581;letter-spacing:1px}
.feed{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto;width:100%}
.msg{max-width:80%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.4;position:relative}
.msg .who{font-size:11px;color:#22c55e;font-family:'Oswald',sans-serif;letter-spacing:.5px;margin-bottom:3px}
.msg.them{align-self:flex-start;background:#161b13;border:1px solid rgba(255,255,255,.07);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#16a34a,#15803d);color:#eafff0;border-bottom-right-radius:4px}
.msg.me .who{color:#bff5d0}
.msg .rep{position:absolute;top:-8px;right:-8px;background:#0a0d0a;border:1px solid rgba(255,255,255,.12);border-radius:50%;width:22px;height:22px;font-size:11px;color:#8a9581;cursor:pointer;display:none;align-items:center;justify-content:center}
.msg.them:hover .rep{display:flex}
.banner{text-align:center;font-size:11px;color:#8a9581;background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.18);border-radius:10px;padding:9px;margin-bottom:6px;line-height:1.5}
.empty{text-align:center;color:#8a9581;padding:30px 10px;font-size:13px}
.bar{position:sticky;bottom:0;background:rgba(10,13,10,.95);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.06);padding:12px;display:flex;gap:8px;max-width:560px;margin:0 auto;width:100%}
.bar input{flex:1;background:#161b13;border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:12px 16px;color:#e7ece4;font-family:'Inter',sans-serif;font-size:15px}
.bar input:focus{outline:none;border-color:#22c55e}
.bar button{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:none;background:#22c55e;color:#06180c;font-size:20px;cursor:pointer}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#ef4444;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transition:.3s;z-index:60;max-width:90%;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="top">
  <a id="back" title="Back">‹</a>
  <div class="t">Team Chat <div class="s" id="teamsub">Players only · Coaches can't see this</div></div>
</div>
<div class="feed" id="feed"><div class="empty">Loading…</div></div>
<div class="bar">
  <input id="input" placeholder="Hype your team up…" maxlength="280">
  <button id="send">↑</button>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
const $ = id => document.getElementById(id)
const esc = s => (s||'').replace(/</g,'&lt;')
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2600) }

;(async () => {
  const tok = new URLSearchParams(location.search).get('t')
  $('back').href = '/player.html?t=' + encodeURIComponent(tok||'')
  const res = tok && await db.getPlayerByToken(tok)
  if (!res){ $('feed').innerHTML='<div class="empty">Open this from your player link to join the chat.</div>'; return }
  const { player, coach } = res
  const coachId = player.coach_id || (coach && coach.id)
  $('teamsub').textContent = ((coach&&coach.team_name)||'Team') + ' · players only'

  async function load(){
    const msgs = await db.getChat(coachId)
    const feed = $('feed')
    if (!msgs.length){ feed.innerHTML = '<div class="banner">Keep it team-first. Hype each other up, hold each other accountable. Profanity and putting teammates down is auto-blocked. Coaches don’t read this.</div><div class="empty">Be the first to say something. 🏈</div>'; return }
    feed.innerHTML = '<div class="banner">Players only · Coaches can’t see this. Keep it clean and team-first.</div>' +
      msgs.map(m=>{
        const mine = m.player_id===player.id
        return `<div class="msg ${mine?'me':'them'}"><div class="who">${esc(m.player_name)}</div>${esc(m.body)}${mine?'':`<div class="rep" data-id="${m.id}" title="Report">⚑</div>`}</div>`
      }).join('')
    feed.querySelectorAll('.rep').forEach(b=>b.onclick=async()=>{ await db.flagChat(b.dataset.id); toast('Reported & hidden. Thanks for protecting the team.'); load() })
    feed.scrollTop = feed.scrollHeight
  }

  async function send(){
    const v=$('input').value.trim(); if(!v) return
    const r = await db.postChat(coachId, player, v)
    if (r.error){ toast(r.error); return }
    $('input').value=''; load()
  }
  $('send').onclick=send
  $('input').addEventListener('keydown',e=>{ if(e.key==='Enter') send() })

  load()
  if (!DEMO) setInterval(load, 5000)   // live: poll for new messages
})()
</script>
</body>
</html>
