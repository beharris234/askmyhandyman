<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0a0d0a">
<title>FieldGeneral — Today</title>
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0d0a;color:#e7ece4;font-family:'Inter',sans-serif;min-height:100vh;padding:22px 18px 50px}
.wrap{max-width:460px;margin:0 auto}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hdr .team{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#22c55e}
.hdr h1{font-family:'Oswald',sans-serif;font-size:23px;font-weight:600;margin-top:2px}
.hdr .pg{font-size:12px;color:#8a9581;margin-top:2px}
.streak{flex:0 0 auto;text-align:center;background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.35);border-radius:12px;padding:8px 12px}
.streak .n{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;color:#f97316;line-height:1}
.streak .l{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#f9a366}
.quote{background:linear-gradient(135deg,rgba(34,197,94,.14),rgba(34,197,94,.04));border:1px solid rgba(34,197,94,.3);border-radius:16px;padding:18px;margin-bottom:14px}
.quote .k{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#22c55e;margin-bottom:6px}
.quote .q{font-family:'Oswald',sans-serif;font-size:19px;font-weight:500;line-height:1.35}
.card{background:#11150f;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:18px;margin-bottom:14px}
.shout{background:linear-gradient(135deg,rgba(249,115,22,.16),rgba(249,115,22,.05));border:1px solid rgba(249,115,22,.4)}
.label{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#8a9581;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.priv{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.5px;text-transform:none;color:#22c55e;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);padding:3px 8px;border-radius:20px}
.msgbox{white-space:pre-wrap;font-size:15px;line-height:1.65}
.wrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px}
.wrow:last-child{border:none}
.wrow .reps{color:#8a9581;font-family:'Oswald',sans-serif}
.nutri{font-size:13px;color:#cdd6c6;line-height:1.55}
.checks{display:flex;flex-direction:column;gap:10px}
.chk{display:flex;align-items:center;gap:14px;background:#0a0d0a;border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:15px 16px;cursor:pointer;transition:.15s}
.chk .ico{font-size:24px}
.chk .t{flex:1}.chk .t .n{font-size:15px;font-weight:600}.chk .t .d{font-size:12px;color:#8a9581}
.chk .box{width:26px;height:26px;border-radius:8px;border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:16px;color:#06180c}
.chk.on{border-color:#22c55e;background:rgba(34,197,94,.08)}.chk.on .box{background:#22c55e;border-color:#22c55e}
.done{text-align:center;margin-top:16px;font-family:'Oswald',sans-serif;letter-spacing:1px;color:#22c55e;font-size:14px;display:none}
.goal{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.goal .b{width:20px;height:20px;border-radius:6px;border:2px solid rgba(255,255,255,.25);flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#06180c}
.goal.on .b{background:#22c55e;border-color:#22c55e}
.goal .x{color:#8a9581;font-size:14px;flex:1}.goal.on .x{text-decoration:line-through;color:#8a9581}
.goal .del{background:none;border:none;color:#545b50;cursor:pointer;font-size:16px}
.addrow{display:flex;gap:8px;margin-top:10px}
input,textarea{width:100%;background:#0a0d0a;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px;color:#e7ece4;font-family:'Inter',sans-serif;font-size:14px}
input:focus,textarea:focus{outline:none;border-color:#22c55e}
.mini{flex:0 0 auto;width:44px;border-radius:10px;border:none;background:#22c55e;color:#06180c;font-size:20px;font-weight:700;cursor:pointer}
.noteitem{font-size:13px;color:#cdd6c6;background:#0a0d0a;border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 12px;margin-top:8px;line-height:1.5}
.noteitem .d{font-size:10px;color:#8a9581;margin-top:4px}
.flag{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:#f97316;cursor:pointer}
.flag .fb{width:18px;height:18px;border-radius:5px;border:2px solid rgba(249,115,22,.5);display:flex;align-items:center;justify-content:center;font-size:12px}
.flag.on .fb{background:#f97316;border-color:#f97316;color:#1a0a00}
.btn{width:100%;padding:14px;border-radius:11px;border:none;font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;letter-spacing:2px;text-transform:uppercase;cursor:pointer}
.btn.chat{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.add{background:none;border:1px solid rgba(255,255,255,.12);color:#e7ece4;margin-top:10px}
.safety{font-size:11px;color:#8a9581;line-height:1.6;text-align:center;margin-top:18px}
.safety b{color:#f97316}
.empty{text-align:center;color:#8a9581;padding:40px 10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#22c55e;color:#06180c;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:.3s;z-index:60}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Loading…</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
const $ = id => document.getElementById(id)
const esc = s => (s||'').replace(/</g,'&lt;')
const date = todayStr()
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1600) }

;(async () => {
  const tok = new URLSearchParams(location.search).get('t')
  if (!tok){ $('app').innerHTML='<div class="empty">No player link found. Ask your coach for your check-in link.</div>'; return }
  const res = await db.getPlayerByToken(tok)
  if (!res){ $('app').innerHTML='<div class="empty">Link not recognized. Ask your coach to resend it.</div>'; return }
  const { player, coach } = res
  const coachId = player.coach_id || (coach && coach.id)
  const group = player.position
  const g = POSITION_GROUPS[group] || { name:'Team', focus:'' }
  const voice = await db.getVoice(coachId) || { examples: DEFAULT_VOICE.examples }

  const [msg, quote, streak, shoutouts, goals, notes] = await Promise.all([
    db.getMessage(coachId, date, group),
    db.getDailyQuote(coachId, date, voice),
    db.getStreak(player.id),
    db.getShoutouts(player.id),
    db.getGoals(player.id),
    db.getNotes(player.id)
  ])
  let chk = await db.getCheckin(player.id, date) || { lift_done:false, ate_right:false, film_watched:false }
  let noteFlag = false

  const items = [
    { k:'lift_done', ico:'🏋️', n:'Did the lift', d:"Today's workout, done" },
    { k:'ate_right', ico:'🍎', n:'Ate right', d:'Real food, plenty of water' },
    { k:'film_watched', ico:'🎬', n:'Watched film', d:'Studied your assignments' }
  ]

  function render(){
    $('app').innerHTML = `
      <div class="hdr">
        <div>
          <div class="team">${esc((coach&&coach.team_name)||'Team')}</div>
          <h1>${player.jersey?'#'+esc(player.jersey)+' ':''}${esc(player.full_name.split(' ')[0])}</h1>
          <div class="pg">${g.name} · ${niceDate(date)}</div>
        </div>
        <div class="streak"><div class="n">${streak}🔥</div><div class="l">day streak</div></div>
      </div>

      <div class="quote"><div class="k">Word of the Day · Coach</div><div class="q">${esc(quote)}</div></div>

      ${ shoutouts && shoutouts.length ? `<div class="card shout"><div class="label">🔥 Coach gave you props</div><div class="msgbox">${esc(shoutouts[0].text)}</div></div>` : '' }

      <button class="btn chat" id="chatBtn">💬 Team Chat</button>

      ${ msg && msg.status==='sent' ? `
        <div class="card"><div class="label">From ${esc((coach&&coach.full_name)||'Coach')}</div><div class="msgbox">${esc(msg.message_text)}</div></div>
        <div class="card"><div class="label">Today's Workout</div>${(msg.workout||[]).map(w=>`<div class="wrow"><span>${esc(w.name)}</span><span class="reps">${esc(w.sets)} × ${esc(w.reps)}</span></div>`).join('')||'<div class="nutri">No workout posted yet.</div>'}</div>
        ${ msg.nutrition ? `<div class="card"><div class="label">Fuel</div><div class="nutri">${esc(msg.nutrition)}</div></div>`:'' }
      ` : `<div class="card"><div class="nutri">Coach hasn't posted today's drop yet — but log your check-ins below.</div></div>` }

      <div class="card">
        <div class="label">Check in</div>
        <div class="checks" id="checks"></div>
        <div class="done" id="done">✓ All in. Coach can see you're bought in.</div>
      </div>

      <div class="card">
        <div class="label">My Goals &amp; Wins <span class="priv">🔒 Only you</span></div>
        <div id="goals"></div>
        <div class="addrow"><input id="goalInput" placeholder="Squat 315 · Earn a starting spot…"><button class="mini" id="addGoal">+</button></div>
      </div>

      <div class="card">
        <div class="label">My Notes <span class="priv">🔒 Only you</span></div>
        <textarea id="noteInput" placeholder="How'd today feel? What are you working on?"></textarea>
        <div class="flag" id="flag"><div class="fb"></div><span>Only share with the athletic trainer if it's an injury / pain</span></div>
        <button class="btn add" id="addNote">Save note</button>
        <div id="notes"></div>
      </div>

      <div class="safety">Hurt or in pain? <b>Tell the athletic trainer</b> — or flag a note above and it routes to them. General healthy-habit guidance only; no diets or calorie targets.</div>
    `
    // checks
    const box=$('checks')
    box.innerHTML = items.map(it=>`<div class="chk ${chk[it.k]?'on':''}" data-k="${it.k}"><div class="ico">${it.ico}</div><div class="t"><div class="n">${it.n}</div><div class="d">${it.d}</div></div><div class="box">${chk[it.k]?'✓':''}</div></div>`).join('')
    box.querySelectorAll('.chk').forEach(el=>el.onclick=async()=>{
      const k=el.dataset.k; chk[k]=!chk[k]
      await db.setCheckin(player.id, date, { lift_done:chk.lift_done, ate_right:chk.ate_right, film_watched:chk.film_watched })
      render(); toast(chk[k]?'Checked ✓':'Unchecked')
    })
    $('done').style.display = (chk.lift_done&&chk.ate_right&&chk.film_watched)?'block':'none'

    // chat
    $('chatBtn').onclick = ()=> location.href='/chat.html?t='+encodeURIComponent(tok)

    // goals
    const gbox=$('goals')
    gbox.innerHTML = goals.length ? goals.map(go=>`<div class="goal ${go.done?'on':''}" data-id="${go.id}"><div class="b">${go.done?'✓':''}</div><div class="x">${esc(go.text)}</div><button class="del">×</button></div>`).join('') : '<div class="nutri">No goals yet. Set one — own your game.</div>'
    gbox.querySelectorAll('.goal').forEach(el=>{
      el.querySelector('.b').onclick=async()=>{ const go=goals.find(x=>x.id===el.dataset.id); go.done=!go.done; await db.toggleGoal(player.id, go.id, go.done); render() }
      el.querySelector('.del').onclick=async()=>{ await db.removeGoal(player.id, el.dataset.id); goals.splice(goals.findIndex(x=>x.id===el.dataset.id),1); render() }
    })
    $('addGoal').onclick=async()=>{ const v=$('goalInput').value.trim(); if(!v)return; const go=await db.addGoal(player.id, v); goals.push(go); render(); toast('Goal added') }

    // notes
    $('flag').onclick=()=>{ noteFlag=!noteFlag; $('flag').classList.toggle('on',noteFlag); $('flag').querySelector('.fb').textContent=noteFlag?'✓':'' }
    $('addNote').onclick=async()=>{ const v=$('noteInput').value.trim(); if(!v)return; const n=await db.addNote(player.id, v, noteFlag); notes.unshift(n); noteFlag=false; render(); toast(n.flagged_for_trainer?'Saved — trainer notified':'Note saved') }
    $('notes').innerHTML = notes.slice(0,5).map(n=>`<div class="noteitem">${esc(n.body)}<div class="d">${n.flagged_for_trainer?'🚑 routed to trainer · ':''}${niceDate(n.for_date||date)}</div></div>`).join('')
  }
  render()
})()
</script>
</body>
</html>
